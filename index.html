<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>내 가계부</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="가계부" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon.png" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d0d14; color: #e8e8f0; font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2a2a4a; border-radius: 2px; }
    input::placeholder, textarea::placeholder { color: #33335a; }
    @keyframes bounce { 0%,100%{transform:translateY(0);opacity:.4} 50%{transform:translateY(-6px);opacity:1} }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbxnEGuKjckkdlBVvuRXEksZlGjWnwQ2vEc1LmZTvp91k_zfZNTq7tR7KiEjdvRbgVFi/exec";
    const ANTHROPIC_KEY = "YOUR_API_KEY_HERE"; // ← 여기에 Anthropic API 키 입력

    const CATEGORY_COLORS = {
      "급여":"#4ade80","부업":"#86efac","투자":"#34d399","용돈":"#6ee7b7",
      "환급":"#a7f3d0","기타수입":"#bbf7d0",
      "식비":"#f87171","교통":"#fb923c","쇼핑":"#fbbf24","의료":"#e879f9",
      "문화/여가":"#818cf8","구독":"#60a5fa","카페":"#f472b6",
      "주거":"#f97316","통신":"#a78bfa","기타지출":"#94a3b8",
    };

    const SMS_EXAMPLES = [
      "[네이버페이]\n승인 홍길동(1234)\n05/18 14:32\n스타벅스 6,500원",
      "[Web발신]\n삼성카드 승인\n홍길동 1234\n17,900원 GS25\n잔여한도 2,300,000원",
      "[KB국민카드]\n[승인]홍*동\n5,500원 이디야커피\n06/01 09:15",
    ];

    function isSmsLike(text) {
      if (!text) return false;
      const keywords = ["승인","결제","Web발신","네이버페이","카카오페이","삼성카드","KB국민","신한카드","현대카드","롯데카드","잔여한도"];
      return keywords.some(k => text.includes(k));
    }

    async function sendToSheet(tx) {
      try {
        await fetch(WEBHOOK_URL, { method:"POST", mode:"no-cors", headers:{"Content-Type":"application/json"}, body:JSON.stringify(tx) });
        return true;
      } catch { return false; }
    }

    function App() {
      const [transactions, setTransactions] = useState([]);
      const [input, setInput] = useState("");
      const [loading, setLoading] = useState(false);
      const [smsMode, setSmsMode] = useState(false);
      const [sheetStatus, setSheetStatus] = useState(null);
      const [tab, setTab] = useState("chat"); // mobile: chat | summary
      const [chatLog, setChatLog] = useState([{
        role:"assistant",
        text:"안녕하세요! 💰 구글 시트 연동 완료!\n\n입력하면 앱 + 구글 시트에 동시 저장돼요 📊\n\n✏️ 자연어: \"점심 파스타 12000원\"\n📱 문자 붙여넣기도 가능해요!"
      }]);
      const inputRef = useRef(null);
      const chatEndRef = useRef(null);
      const [exampleIdx, setExampleIdx] = useState(0);
      const isMobile = window.innerWidth < 768;

      useEffect(() => { chatEndRef.current?.scrollIntoView({ behavior:"smooth" }); }, [chatLog]);
      useEffect(() => {
        const t = setInterval(() => setExampleIdx(i => (i+1) % SMS_EXAMPLES.length), 3000);
        return () => clearInterval(t);
      }, []);

      const totalIncome = transactions.filter(t=>t.type==="income").reduce((s,t)=>s+t.amount,0);
      const totalExpense = transactions.filter(t=>t.type==="expense").reduce((s,t)=>s+t.amount,0);
      const balance = totalIncome - totalExpense;
      const fmt = n => n.toLocaleString("ko-KR")+"원";

      const handleSend = async () => {
        const text = input.trim();
        if (!text || loading) return;
        setInput("");
        const detectedSms = isSmsLike(text);
        setChatLog(prev => [...prev, { role:"user", text, isSms:detectedSms }]);
        setLoading(true);
        if (isMobile) setTab("chat");

        try {
          const today = new Date().toLocaleDateString("ko-KR");
          const systemPrompt = `당신은 가계부 도우미입니다. 자연어 또는 카드/결제 문자 메시지에서 수입/지출 정보를 모두 추출하세요.
반드시 JSON 배열만 반환하세요. 다른 텍스트는 절대 포함하지 마세요. 단건도 배열로 반환하세요.
형식: [{"type":"income"|"expense"|"unknown","amount":숫자,"description":"설명","category":"카테고리","date":"YYYY-MM-DD","message":"확인메시지"}]
수입 카테고리: 급여,부업,투자,용돈,환급,기타수입
지출 카테고리: 식비,교통,쇼핑,의료,문화/여가,구독,카페,주거,통신,기타지출
문자 파싱: 승인/결제완료→expense, 가맹점명을 description, 금액 숫자만 추출, MM/DD→올해연도추가, 광고→unknown
오늘: ${today}`;

          const resp = await fetch("https://api.anthropic.com/v1/messages", {
            method:"POST",
            headers:{"Content-Type":"application/json","x-api-key":ANTHROPIC_KEY,"anthropic-version":"2023-06-01"},
            body:JSON.stringify({ model:"claude-sonnet-4-20250514", max_tokens:1000, system:systemPrompt, messages:[{role:"user",content:text}] }),
          });

          const data = await resp.json();
          const raw = data.content.map(c=>c.text||"").join("");
          const parsed = JSON.parse(raw.replace(/```json|```/g,"").trim());

          const added = parsed.filter(i=>i.type!=="unknown"&&i.amount>0).map(item => ({
            id: Date.now()+Math.random(), type:item.type, amount:item.amount,
            description:item.description, category:item.category,
            date:item.date||new Date().toISOString().split("T")[0],
          }));

          if (added.length > 0) {
            setTransactions(prev=>[...added.reverse(),...prev]);
            setSheetStatus("syncing");
            await Promise.all(added.map(tx=>sendToSheet(tx)));
            setSheetStatus("ok");
            setTimeout(()=>setSheetStatus(null), 3000);
          }

          const replyText = added.length > 1
            ? `✅ ${added.length}건 등록!\n${added.map(t=>`• ${t.description} ${fmt(t.amount)}`).join("\n")}\n📊 구글 시트 저장 완료!`
            : added.length === 1
            ? `✅ ${added[0].description} ${fmt(added[0].amount)} 등록!\n📊 구글 시트 저장 완료!`
            : "ℹ️ 수입/지출 내역을 찾지 못했어요.";

          setChatLog(prev=>[...prev,{role:"assistant",text:replyText}]);
        } catch(e) {
          setChatLog(prev=>[...prev,{role:"assistant",text:"⚠️ 오류가 발생했어요. 다시 시도해 주세요."}]);
        } finally {
          setLoading(false);
          inputRef.current?.focus();
        }
      };

      const handleKey = e => {
        if (e.key==="Enter" && !smsMode && !e.shiftKey) { e.preventDefault(); handleSend(); }
        if (e.key==="Enter" && (e.metaKey||e.ctrlKey)) handleSend();
      };

      const expenseByCategory = transactions.filter(t=>t.type==="expense")
        .reduce((acc,t)=>{ acc[t.category]=(acc[t.category]||0)+t.amount; return acc; },{});

      // ── 요약 패널 (왼쪽 or 모바일 탭) ──
      const SummaryPanel = () => (
        <div style={{ display:"flex", flexDirection:"column", gap:12, padding: isMobile ? "16px" : "24px 20px", overflowY:"auto", flex:1 }}>
          {/* 헤더 */}
          <div>
            <div style={{fontSize:11,letterSpacing:3,color:"#5555aa",textTransform:"uppercase",marginBottom:4}}>MY FINANCES</div>
            <div style={{fontSize:24,fontWeight:800,color:"#fff"}}>가계부</div>
            <div style={{fontSize:11,color:"#44446a",marginTop:2}}>{new Date().toLocaleDateString("ko-KR",{year:"numeric",month:"long",day:"numeric"})}</div>
          </div>

          {/* 시트 연동 상태 */}
          <div style={{display:"flex",alignItems:"center",gap:8,padding:"8px 12px",borderRadius:10,background:"#0e0e20",border:"1px solid #2a2a4a"}}>
            <div style={{width:8,height:8,borderRadius:"50%",background:sheetStatus==="syncing"?"#fbbf24":sheetStatus==="fail"?"#f87171":"#4ade80",animation:sheetStatus==="syncing"?"pulse 1s infinite":"none"}}/>
            <div style={{fontSize:11,color:"#7777aa"}}>
              {sheetStatus==="syncing"?"구글 시트 저장 중...":sheetStatus==="fail"?"시트 저장 실패":sheetStatus==="ok"?"구글 시트 저장 완료!":"구글 시트 연동됨 ✓"}
            </div>
          </div>

          {/* 잔액 */}
          <div style={{background:"linear-gradient(135deg,#1a1a2e,#16213e)",border:"1px solid #2a2a4a",borderRadius:16,padding:16}}>
            <div style={{fontSize:11,color:"#5555aa",letterSpacing:2,marginBottom:6}}>BALANCE</div>
            <div style={{fontSize:28,fontWeight:900,color:balance>=0?"#4ade80":"#f87171"}}>{balance>=0?"+":""}{fmt(balance)}</div>
            <div style={{display:"flex",gap:16,marginTop:12}}>
              <div><div style={{fontSize:10,color:"#5555aa",marginBottom:2}}>수입</div><div style={{fontSize:13,fontWeight:700,color:"#4ade80"}}>+{fmt(totalIncome)}</div></div>
              <div style={{width:1,background:"#2a2a4a"}}/>
              <div><div style={{fontSize:10,color:"#5555aa",marginBottom:2}}>지출</div><div style={{fontSize:13,fontWeight:700,color:"#f87171"}}>-{fmt(totalExpense)}</div></div>
            </div>
          </div>

          {/* 카테고리 */}
          {Object.keys(expenseByCategory).length > 0 && (
            <div>
              <div style={{fontSize:11,color:"#5555aa",letterSpacing:2,marginBottom:8}}>지출 카테고리</div>
              {Object.entries(expenseByCategory).sort((a,b)=>b[1]-a[1]).map(([cat,amt])=>(
                <div key={cat} style={{marginBottom:8}}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:3,fontSize:12}}>
                    <span style={{color:"#aaaacc"}}>{cat}</span>
                    <span style={{color:CATEGORY_COLORS[cat]||"#aaa",fontWeight:600}}>{fmt(amt)}</span>
                  </div>
                  <div style={{height:3,background:"#1e1e30",borderRadius:2}}>
                    <div style={{height:"100%",width:`${Math.min(100,(amt/totalExpense)*100)}%`,background:CATEGORY_COLORS[cat]||"#aaa",borderRadius:2,transition:"width 0.5s"}}/>
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* 내역 */}
          <div>
            <div style={{fontSize:11,color:"#5555aa",letterSpacing:2,marginBottom:8}}>내역</div>
            {transactions.length === 0
              ? <div style={{fontSize:12,color:"#33335a",textAlign:"center",paddingTop:12}}>아직 내역이 없어요</div>
              : transactions.map(tx=>(
                <div key={tx.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:"1px solid #1a1a28"}}>
                  <div>
                    <div style={{fontSize:10,padding:"2px 7px",borderRadius:20,background:(CATEGORY_COLORS[tx.category]||"#aaa")+"22",color:CATEGORY_COLORS[tx.category]||"#aaa",display:"inline-block",marginBottom:2}}>{tx.category}</div>
                    <div style={{fontSize:12,color:"#9999bb"}}>{tx.description}</div>
                    <div style={{fontSize:10,color:"#44446a"}}>{tx.date}</div>
                  </div>
                  <div style={{fontSize:13,fontWeight:700,color:tx.type==="income"?"#4ade80":"#f87171"}}>
                    {tx.type==="income"?"+":"-"}{fmt(tx.amount)}
                  </div>
                </div>
              ))}
          </div>
        </div>
      );

      // ── 채팅 패널 ──
      const ChatPanel = () => (
        <div style={{flex:1,display:"flex",flexDirection:"column",minHeight:0}}>
          <div style={{padding:"16px 20px",borderBottom:"1px solid #1e1e30"}}>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <div style={{fontSize:14,fontWeight:700,color:"#7777dd"}}>💬 내역 입력</div>
              <div style={{fontSize:10,padding:"2px 8px",borderRadius:20,background:"#1a3a1a",border:"1px solid #2a5a2a",color:"#4ade80"}}>📊 시트 연동</div>
            </div>
            <div style={{fontSize:11,color:"#44446a",marginTop:2}}>입력 → 앱 + 구글 시트 동시 저장</div>
          </div>

          {/* SMS 예시 */}
          <div style={{margin:"12px 16px 0",background:"#0e0e20",border:"1px solid #2a2a4a",borderRadius:10,padding:"10px 14px",display:"flex",gap:10,alignItems:"flex-start"}}>
            <div style={{fontSize:18,flexShrink:0}}>📱</div>
            <div style={{flex:1}}>
              <div style={{fontSize:11,fontWeight:700,color:"#7777dd",marginBottom:4}}>문자 붙여넣기 지원</div>
              <div style={{background:"#13131f",borderRadius:6,padding:"8px 10px",fontSize:10,color:"#6666aa",fontFamily:"monospace",whiteSpace:"pre-wrap",lineHeight:1.7}}>
                {SMS_EXAMPLES[exampleIdx]}
              </div>
            </div>
          </div>

          {/* 메시지 */}
          <div style={{flex:1,overflowY:"auto",padding:"16px",display:"flex",flexDirection:"column",gap:10}}>
            {chatLog.map((msg,i)=>(
              <div key={i} style={{display:"flex",flexDirection:"column",alignItems:msg.role==="user"?"flex-end":"flex-start"}}>
                {msg.isSms && <div style={{fontSize:10,color:"#5555aa",marginBottom:2}}>📱 문자 감지됨</div>}
                <div style={{
                  maxWidth:"80%",padding:"10px 14px",
                  borderRadius:msg.role==="user"?"16px 16px 4px 16px":"16px 16px 16px 4px",
                  background:msg.role==="user"?"linear-gradient(135deg,#4f46e5,#7c3aed)":"#1a1a2e",
                  border:msg.role==="assistant"?"1px solid #2a2a4a":"none",
                  fontSize:13,lineHeight:1.6,color:"#e8e8f0",whiteSpace:"pre-wrap",
                  fontFamily:msg.isSms?"monospace":"inherit",
                }}>{msg.text}</div>
              </div>
            ))}
            {loading && (
              <div style={{display:"flex",gap:5,padding:"6px 2px"}}>
                {[0,1,2].map(i=><div key={i} style={{width:7,height:7,borderRadius:"50%",background:"#4f46e5",animation:`bounce 1s ${i*0.2}s infinite`}}/>)}
              </div>
            )}
            <div ref={chatEndRef}/>
          </div>

          {/* 입력창 */}
          <div style={{padding:"12px 16px 20px",borderTop:"1px solid #1e1e30"}}>
            <div style={{display:"flex",gap:6,marginBottom:8}}>
              {[{label:"✏️ 자연어",val:false},{label:"📱 문자",val:true}].map(({label,val})=>(
                <button key={label} onClick={()=>{setSmsMode(val);setTimeout(()=>inputRef.current?.focus(),50);}} style={{
                  padding:"4px 12px",borderRadius:20,border:"1px solid",
                  borderColor:smsMode===val?"#4f46e5":"#2a2a4a",
                  background:smsMode===val?"#4f46e522":"transparent",
                  color:smsMode===val?"#9999ff":"#55556a",
                  fontSize:11,cursor:"pointer",
                }}>{label}</button>
              ))}
            </div>
            <div style={{display:"flex",gap:8,alignItems:"flex-end"}}>
              {smsMode
                ? <textarea ref={inputRef} value={input} onChange={e=>setInput(e.target.value)} onKeyDown={handleKey}
                    placeholder={"결제 문자를 붙여넣으세요\n여러 건도 한번에 가능"} rows={3}
                    style={{flex:1,background:"#13131f",border:"1px solid #2a2a5a",borderRadius:10,padding:"10px 14px",fontSize:12,color:"#e8e8f0",outline:"none",resize:"none",fontFamily:"monospace",lineHeight:1.6}}/>
                : <input ref={inputRef} value={input} onChange={e=>setInput(e.target.value)} onKeyDown={handleKey}
                    placeholder="맥도날드 10500원"
                    style={{flex:1,background:"#13131f",border:"1px solid #2a2a4a",borderRadius:10,padding:"10px 14px",fontSize:13,color:"#e8e8f0",outline:"none"}}/>
              }
              <button onClick={handleSend} disabled={loading||!input.trim()} style={{
                padding:"10px 18px",borderRadius:10,height:42,
                background:loading||!input.trim()?"#2a2a4a":"linear-gradient(135deg,#4f46e5,#7c3aed)",
                border:"none",color:"#fff",fontSize:13,fontWeight:700,
                cursor:loading||!input.trim()?"not-allowed":"pointer",alignSelf:"flex-end",
              }}>전송</button>
            </div>
          </div>
        </div>
      );

      // ── 모바일 레이아웃 ──
      if (isMobile) {
        return (
          <div style={{height:"100vh",display:"flex",flexDirection:"column",background:"#0d0d14"}}>
            {/* 탭 */}
            <div style={{display:"flex",background:"#13131f",borderBottom:"1px solid #1e1e30"}}>
              {[{id:"chat",label:"💬 입력"},{id:"summary",label:"📊 내역"}].map(({id,label})=>(
                <button key={id} onClick={()=>setTab(id)} style={{
                  flex:1,padding:"14px",border:"none",background:"transparent",
                  color:tab===id?"#9999ff":"#55556a",fontSize:13,fontWeight:tab===id?700:400,
                  borderBottom:tab===id?"2px solid #4f46e5":"2px solid transparent",cursor:"pointer",
                }}>{label}</button>
              ))}
            </div>
            <div style={{flex:1,overflow:"hidden",display:"flex",flexDirection:"column"}}>
              {tab==="chat" ? <ChatPanel/> : <SummaryPanel/>}
            </div>
          </div>
        );
      }

      // ── 데스크탑 레이아웃 ──
      return (
        <div style={{height:"100vh",display:"flex",background:"#0d0d14"}}>
          <div style={{width:320,background:"#13131f",borderRight:"1px solid #1e1e30",display:"flex",flexDirection:"column",overflow:"hidden"}}>
            <SummaryPanel/>
          </div>
          <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
            <ChatPanel/>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
