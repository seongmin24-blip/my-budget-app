<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>내 가계부</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="가계부" />
  <link rel="manifest" href="manifest.json" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #0d0d14; color: #e8e8f0; font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }

    #app { display: flex; height: 100vh; }

    /* LEFT */
    #left { width: 300px; min-width: 300px; background: #13131f; border-right: 1px solid #1e1e30; display: flex; flex-direction: column; overflow-y: auto; padding: 20px 16px; }
    .left-title { font-size: 10px; letter-spacing: 3px; color: #5555aa; text-transform: uppercase; margin-bottom: 4px; }
    .left-heading { font-size: 24px; font-weight: 800; color: #fff; }
    .left-date { font-size: 11px; color: #44446a; margin-top: 3px; margin-bottom: 16px; }
    .sheet-status { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 10px; background: #0e0e20; border: 1px solid #2a2a4a; margin-bottom: 14px; font-size: 11px; color: #7777aa; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; flex-shrink: 0; }
    .dot.syncing { background: #fbbf24; animation: pulse 1s infinite; }
    .dot.fail { background: #f87171; }
    .balance-card { background: linear-gradient(135deg,#1a1a2e,#16213e); border: 1px solid #2a2a4a; border-radius: 14px; padding: 16px; margin-bottom: 14px; }
    .balance-label { font-size: 10px; color: #5555aa; letter-spacing: 2px; margin-bottom: 6px; }
    .balance-amount { font-size: 28px; font-weight: 900; letter-spacing: -1px; }
    .balance-row { display: flex; gap: 14px; margin-top: 12px; }
    .balance-item label { font-size: 10px; color: #5555aa; display: block; margin-bottom: 2px; }
    .balance-item span { font-size: 13px; font-weight: 700; }
    .divider { width: 1px; background: #2a2a4a; }
    .section-title { font-size: 10px; color: #5555aa; letter-spacing: 2px; margin-bottom: 8px; }
    .cat-row { margin-bottom: 8px; }
    .cat-info { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 3px; }
    .cat-bar-bg { height: 3px; background: #1e1e30; border-radius: 2px; }
    .cat-bar { height: 100%; border-radius: 2px; transition: width 0.5s; }
    .tx-item { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid #1a1a28; }
    .tx-left .tx-cat { font-size: 10px; padding: 2px 7px; border-radius: 20px; display: inline-block; margin-bottom: 2px; }
    .tx-left .tx-desc { font-size: 12px; color: #9999bb; }
    .tx-left .tx-date { font-size: 10px; color: #44446a; }
    .tx-amount { font-size: 13px; font-weight: 700; }
    .empty { font-size: 12px; color: #33335a; text-align: center; padding-top: 16px; }

    /* RIGHT */
    #right { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    #chat-header { padding: 16px 20px; border-bottom: 1px solid #1e1e30; flex-shrink: 0; }
    #chat-header h2 { font-size: 14px; font-weight: 700; color: #7777dd; display: flex; align-items: center; gap: 8px; }
    #chat-header p { font-size: 11px; color: #44446a; margin-top: 2px; }
    .badge { font-size: 10px; padding: 2px 8px; border-radius: 20px; background: #1a3a1a; border: 1px solid #2a5a2a; color: #4ade80; }
    #sms-tip { margin: 12px 16px 0; background: #0e0e20; border: 1px solid #2a2a4a; border-radius: 10px; padding: 12px 14px; display: flex; gap: 10px; flex-shrink: 0; }
    #sms-tip .tip-icon { font-size: 18px; flex-shrink: 0; }
    #sms-tip .tip-title { font-size: 11px; font-weight: 700; color: #7777dd; margin-bottom: 6px; }
    #sms-example { background: #13131f; border-radius: 6px; padding: 8px 10px; font-size: 10px; color: #6666aa; font-family: monospace; white-space: pre-wrap; line-height: 1.7; min-height: 52px; }
    #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .msg-wrap { display: flex; flex-direction: column; }
    .msg-wrap.user { align-items: flex-end; }
    .msg-wrap.bot { align-items: flex-start; }
    .sms-tag { font-size: 10px; color: #5555aa; margin-bottom: 3px; }
    .msg-bubble { max-width: 78%; padding: 10px 14px; font-size: 13px; line-height: 1.65; white-space: pre-wrap; }
    .msg-bubble.user { background: linear-gradient(135deg,#4f46e5,#7c3aed); border-radius: 16px 16px 4px 16px; color: #fff; }
    .msg-bubble.bot { background: #1a1a2e; border: 1px solid #2a2a4a; border-radius: 16px 16px 16px 4px; color: #e8e8f0; }
    .typing { display: flex; gap: 5px; padding: 6px 2px; }
    .typing span { width: 7px; height: 7px; border-radius: 50%; background: #4f46e5; animation: bounce 1s infinite; }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    #input-area { padding: 12px 16px 20px; border-top: 1px solid #1e1e30; flex-shrink: 0; }
    .mode-btns { display: flex; gap: 6px; margin-bottom: 8px; }
    .mode-btn { padding: 4px 12px; border-radius: 20px; border: 1px solid #2a2a4a; background: transparent; color: #55556a; font-size: 11px; cursor: pointer; transition: all 0.2s; }
    .mode-btn.active { border-color: #4f46e5; background: #4f46e522; color: #9999ff; }
    .input-row { display: flex; gap: 8px; align-items: flex-end; }
    #text-input { flex: 1; background: #13131f; border: 1px solid #2a2a4a; border-radius: 10px; padding: 10px 14px; font-size: 13px; color: #e8e8f0; outline: none; font-family: inherit; }
    #text-input::placeholder { color: #33335a; }
    #sms-input { flex: 1; background: #13131f; border: 1px solid #2a2a5a; border-radius: 10px; padding: 10px 14px; font-size: 12px; color: #e8e8f0; outline: none; resize: none; font-family: monospace; line-height: 1.6; display: none; }
    #sms-input::placeholder { color: #33335a; }
    #send-btn { padding: 10px 18px; border-radius: 10px; border: none; background: linear-gradient(135deg,#4f46e5,#7c3aed); color: #fff; font-size: 13px; font-weight: 700; cursor: pointer; height: 42px; align-self: flex-end; white-space: nowrap; }
    #send-btn:disabled { background: #2a2a4a; cursor: not-allowed; }

    /* Mobile */
    #tab-bar { display: none; }
    @media (max-width: 700px) {
      #left { display: none; width: 100%; min-width: unset; border-right: none; }
      #left.show { display: flex; position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 10; }
      #tab-bar { display: flex; background: #13131f; border-bottom: 1px solid #1e1e30; flex-shrink: 0; }
      .tab-btn { flex: 1; padding: 13px; border: none; background: transparent; color: #55556a; font-size: 13px; cursor: pointer; border-bottom: 2px solid transparent; }
      .tab-btn.active { color: #9999ff; font-weight: 700; border-bottom: 2px solid #4f46e5; }
      #app { flex-direction: column; }
      #right { flex: 1; overflow: hidden; }
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2a2a4a; border-radius: 2px; }
    @keyframes bounce { 0%,100%{transform:translateY(0);opacity:.4} 50%{transform:translateY(-6px);opacity:1} }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  </style>
</head>
<body>
<div id="app">
  <!-- TAB BAR (mobile) -->
  <div id="tab-bar">
    <button class="tab-btn active" onclick="showTab('chat')">💬 입력</button>
    <button class="tab-btn" onclick="showTab('summary')">📊 내역</button>
  </div>

  <!-- LEFT PANEL -->
  <div id="left">
    <div class="left-title">MY FINANCES</div>
    <div class="left-heading">가계부</div>
    <div class="left-date" id="today-date"></div>
    <div class="sheet-status">
      <div class="dot" id="status-dot"></div>
      <span id="status-text">구글 시트 연동됨 ✓</span>
    </div>
    <div class="balance-card">
      <div class="balance-label">BALANCE</div>
      <div class="balance-amount" id="balance-amt" style="color:#4ade80">+0원</div>
      <div class="balance-row">
        <div class="balance-item"><label>수입</label><span id="income-amt" style="color:#4ade80">+0원</span></div>
        <div class="divider"></div>
        <div class="balance-item"><label>지출</label><span id="expense-amt" style="color:#f87171">-0원</span></div>
      </div>
    </div>
    <div id="cat-section" style="display:none; margin-bottom:14px;">
      <div class="section-title">지출 카테고리</div>
      <div id="cat-list"></div>
    </div>
    <div>
      <div class="section-title">내역</div>
      <div id="tx-list"><div class="empty">아직 내역이 없어요</div></div>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div id="right">
    <div id="chat-header">
      <h2>💬 내역 입력 <span class="badge">📊 시트 연동</span></h2>
      <p>입력하면 앱 + 구글 시트 동시 저장</p>
    </div>
    <div id="sms-tip">
      <div class="tip-icon">📱</div>
      <div>
        <div class="tip-title">문자 붙여넣기 지원</div>
        <div id="sms-example">[네이버페이]\n승인 홍길동(1234)\n05/18 14:32\n스타벅스 6,500원</div>
      </div>
    </div>
    <div id="messages"></div>
    <div id="input-area">
      <div class="mode-btns">
        <button class="mode-btn active" id="btn-natural" onclick="setMode('natural')">✏️ 자연어</button>
        <button class="mode-btn" id="btn-sms" onclick="setMode('sms')">📱 문자</button>
      </div>
      <div class="input-row">
        <input type="text" id="text-input" placeholder="맥도날드 10500원" />
        <textarea id="sms-input" rows="3" placeholder="결제 문자를 붙여넣으세요&#10;여러 건도 한번에 가능"></textarea>
        <button id="send-btn" onclick="handleSend()">전송</button>
      </div>
    </div>
  </div>
</div>

<script>
  const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbxnEGuKjckkdlBVvuRXEksZlGjWnwQ2vEc1LmZTvp91k_zfZNTq7tR7KiEjdvRbgVFi/exec";
  const ANTHROPIC_KEY = "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";

  const CATEGORY_COLORS = {
    "급여":"#4ade80","부업":"#86efac","투자":"#34d399","용돈":"#6ee7b7","환급":"#a7f3d0","기타수입":"#bbf7d0",
    "식비":"#f87171","교통":"#fb923c","쇼핑":"#fbbf24","의료":"#e879f9","문화/여가":"#818cf8",
    "구독":"#60a5fa","카페":"#f472b6","주거":"#f97316","통신":"#a78bfa","기타지출":"#94a3b8"
  };

  const SMS_EXAMPLES = [
    "[네이버페이]\n승인 홍길동(1234)\n05/18 14:32\n스타벅스 6,500원",
    "[Web발신]\n삼성카드 승인\n홍길동 1234\n17,900원 GS25\n잔여한도 2,300,000원",
    "[KB국민카드]\n[승인]홍*동\n5,500원 이디야커피\n06/01 09:15"
  ];

  let transactions = [];
  let isLoading = false;
  let smsMode = false;
  let exampleIdx = 0;

  // Init
  document.getElementById('today-date').textContent = new Date().toLocaleDateString('ko-KR', {year:'numeric',month:'long',day:'numeric'});
  setInterval(() => {
    exampleIdx = (exampleIdx + 1) % SMS_EXAMPLES.length;
    document.getElementById('sms-example').textContent = SMS_EXAMPLES[exampleIdx];
  }, 3000);

  addMessage('bot', '안녕하세요! 💰 구글 시트 연동 완료!\n\n입력하면 앱 + 구글 시트에 동시 저장돼요 📊\n\n✏️ 자연어: "점심 파스타 12000원"\n📱 문자 붙여넣기도 가능해요!');

  // Enter key
  document.getElementById('text-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
  });
  document.getElementById('sms-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) handleSend();
  });

  function setMode(mode) {
    smsMode = mode === 'sms';
    document.getElementById('btn-natural').className = 'mode-btn' + (smsMode ? '' : ' active');
    document.getElementById('btn-sms').className = 'mode-btn' + (smsMode ? ' active' : '');
    document.getElementById('text-input').style.display = smsMode ? 'none' : '';
    document.getElementById('sms-input').style.display = smsMode ? '' : 'none';
    setTimeout(() => (smsMode ? document.getElementById('sms-input') : document.getElementById('text-input')).focus(), 50);
  }

  function showTab(tab) {
    document.querySelectorAll('.tab-btn').forEach((b,i) => b.className = 'tab-btn' + ((i === (tab==='chat'?0:1)) ? ' active' : ''));
    const left = document.getElementById('left');
    if (tab === 'summary') { left.classList.add('show'); }
    else { left.classList.remove('show'); }
  }

  function fmt(n) { return n.toLocaleString('ko-KR') + '원'; }

  function isSmsLike(text) {
    const keywords = ["승인","결제","Web발신","네이버페이","카카오페이","삼성카드","KB국민","신한카드","현대카드","롯데카드","잔여한도"];
    return keywords.some(k => text.includes(k));
  }

  function addMessage(role, text, isSms) {
    const msgs = document.getElementById('messages');
    const wrap = document.createElement('div');
    wrap.className = 'msg-wrap ' + (role === 'user' ? 'user' : 'bot');
    if (isSms) {
      const tag = document.createElement('div');
      tag.className = 'sms-tag';
      tag.textContent = '📱 문자 감지됨';
      wrap.appendChild(tag);
    }
    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble ' + (role === 'user' ? 'user' : 'bot');
    bubble.textContent = text;
    wrap.appendChild(bubble);
    msgs.appendChild(wrap);
    msgs.scrollTop = msgs.scrollHeight;
    return wrap;
  }

  function showTyping() {
    const msgs = document.getElementById('messages');
    const div = document.createElement('div');
    div.id = 'typing-indicator';
    div.className = 'typing';
    div.innerHTML = '<span></span><span></span><span></span>';
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function hideTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  function setStatus(state) {
    const dot = document.getElementById('status-dot');
    const text = document.getElementById('status-text');
    dot.className = 'dot' + (state === 'syncing' ? ' syncing' : state === 'fail' ? ' fail' : '');
    text.textContent = state === 'syncing' ? '구글 시트 저장 중...' : state === 'fail' ? '시트 저장 실패' : state === 'ok' ? '구글 시트 저장 완료!' : '구글 시트 연동됨 ✓';
    if (state === 'ok') setTimeout(() => setStatus('idle'), 3000);
  }

  function updateSummary() {
    const income = transactions.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
    const expense = transactions.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
    const balance = income - expense;
    const balEl = document.getElementById('balance-amt');
    balEl.textContent = (balance >= 0 ? '+' : '') + fmt(balance);
    balEl.style.color = balance >= 0 ? '#4ade80' : '#f87171';
    document.getElementById('income-amt').textContent = '+' + fmt(income);
    document.getElementById('expense-amt').textContent = '-' + fmt(expense);

    // Categories
    const cats = {};
    transactions.filter(t=>t.type==='expense').forEach(t => { cats[t.category] = (cats[t.category]||0) + t.amount; });
    const catSection = document.getElementById('cat-section');
    const catList = document.getElementById('cat-list');
    if (Object.keys(cats).length > 0) {
      catSection.style.display = '';
      catList.innerHTML = '';
      Object.entries(cats).sort((a,b)=>b[1]-a[1]).forEach(([cat, amt]) => {
        const color = CATEGORY_COLORS[cat] || '#aaa';
        const pct = Math.min(100, (amt / expense) * 100);
        catList.innerHTML += `<div class="cat-row">
          <div class="cat-info"><span style="color:#aaaacc">${cat}</span><span style="color:${color};font-weight:600">${fmt(amt)}</span></div>
          <div class="cat-bar-bg"><div class="cat-bar" style="width:${pct}%;background:${color}"></div></div>
        </div>`;
      });
    } else { catSection.style.display = 'none'; }

    // Transactions
    const txList = document.getElementById('tx-list');
    if (transactions.length === 0) {
      txList.innerHTML = '<div class="empty">아직 내역이 없어요</div>';
    } else {
      txList.innerHTML = transactions.map(tx => {
        const color = CATEGORY_COLORS[tx.category] || '#aaa';
        return `<div class="tx-item">
          <div class="tx-left">
            <span class="tx-cat" style="background:${color}22;color:${color}">${tx.category}</span>
            <div class="tx-desc">${tx.description}</div>
            <div class="tx-date">${tx.date}</div>
          </div>
          <div class="tx-amount" style="color:${tx.type==='income'?'#4ade80':'#f87171'}">${tx.type==='income'?'+':'-'}${fmt(tx.amount)}</div>
        </div>`;
      }).join('');
    }
  }

  async function sendToSheet(tx) {
    try {
      await fetch(WEBHOOK_URL, { method:'POST', mode:'no-cors', headers:{'Content-Type':'application/json'}, body:JSON.stringify(tx) });
      return true;
    } catch { return false; }
  }

  async function handleSend() {
    const inputEl = smsMode ? document.getElementById('sms-input') : document.getElementById('text-input');
    const text = inputEl.value.trim();
    if (!text || isLoading) return;

    inputEl.value = '';
    isLoading = true;
    document.getElementById('send-btn').disabled = true;

    const detectedSms = isSmsLike(text);
    addMessage('user', text, detectedSms);
    showTyping();

    try {
      const today = new Date().toLocaleDateString('ko-KR');
      const systemPrompt = `당신은 가계부 도우미입니다. 자연어 또는 카드/결제 문자에서 수입/지출 정보를 추출하세요.
반드시 JSON 배열만 반환하세요. 다른 텍스트 절대 포함 금지. 단건도 배열로 반환.
형식: [{"type":"income"|"expense"|"unknown","amount":숫자,"description":"설명","category":"카테고리","date":"YYYY-MM-DD","message":"확인메시지"}]
수입 카테고리: 급여,부업,투자,용돈,환급,기타수입
지출 카테고리: 식비,교통,쇼핑,의료,문화/여가,구독,카페,주거,통신,기타지출
문자 파싱: 승인/결제→expense, 가맹점명→description, 금액숫자만, MM/DD→올해연도, 광고→unknown
오늘: ${today}`;

      const resp = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-api-key': ANTHROPIC_KEY, 'anthropic-version': '2023-06-01' },
        body: JSON.stringify({ model: 'claude-sonnet-4-20250514', max_tokens: 1000, system: systemPrompt, messages: [{ role: 'user', content: text }] })
      });

      const data = await resp.json();
      const raw = data.content.map(c => c.text || '').join('');
      const parsed = JSON.parse(raw.replace(/```json|```/g, '').trim());
      const added = parsed.filter(i => i.type !== 'unknown' && i.amount > 0).map(item => ({
        id: Date.now() + Math.random(), type: item.type, amount: item.amount,
        description: item.description, category: item.category,
        date: item.date || new Date().toISOString().split('T')[0]
      }));

      if (added.length > 0) {
        transactions = [...added, ...transactions];
        updateSummary();
        setStatus('syncing');
        await Promise.all(added.map(tx => sendToSheet(tx)));
        setStatus('ok');
      }

      const reply = added.length > 1
        ? `✅ ${added.length}건 등록!\n${added.map(t=>`• ${t.description} ${fmt(t.amount)}`).join('\n')}\n📊 구글 시트 저장 완료!`
        : added.length === 1
        ? `✅ ${added[0].description} ${fmt(added[0].amount)} 등록!\n📊 구글 시트 저장 완료!`
        : 'ℹ️ 수입/지출 내역을 찾지 못했어요.';

      hideTyping();
      addMessage('bot', reply);
    } catch(e) {
      hideTyping();
      addMessage('bot', '⚠️ 오류가 발생했어요. API 키를 확인해주세요.');
    }

    isLoading = false;
    document.getElementById('send-btn').disabled = false;
    inputEl.focus();
  }

  updateSummary();
</script>
</body>
</html>
